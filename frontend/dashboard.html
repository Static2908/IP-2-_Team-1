<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1>Dashboard</h1>
            <ul class="nav-menu">
                <li><a href="#profile">Profile</a></li>
                <li><a href="#skills">Skills</a></li>
                <li><a href="#gaps">Skill Gaps</a></li>
                <li><a href="#recommendations">Recommendations</a></li>
                <li><a href="login.html" class="btn btn-logout">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <section id="profile" class="section">
            <h2>Student Profile</h2>
            <div class="profile-info">
                <p><strong>Name:</strong> <span id="studentName"></span></p>
                <p><strong>Department:</strong> <span id="studentDept"></span></p>
                <p><strong>Semester:</strong> <span id="studentSem"></span></p>
                <p><strong>CGPA:</strong> <span id="studentCGPA"></span></p>
            </div>
        </section>

        <section id="skills" class="section">
            <h2>Your Skills</h2>
            <canvas id="skillsChart"></canvas>
        </section>

        <section id="gaps" class="section">
            <h2>Skill Gaps Analysis</h2>
            <canvas id="gapChart"></canvas>
        </section>

        <section id="recommendations" class="section">
            <h2>Learning Recommendations</h2>
            <div id="recommendationsList" class="recommendations-list">
                <!-- Recommendations will be loaded here -->
            </div>
        </section>

        <div class="action-buttons">
            <a href="skillEntry.html" class="btn btn-primary">Add Skills</a>
            <a href="assessmentQuiz.html" class="btn btn-primary">Take Assessment</a>
        </div>
    </div>

    <script src="js/charts.js"></script>
    <script src="js/validation.js"></script>
</body>
</html>
